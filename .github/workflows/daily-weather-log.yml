name: Daily Weather Logger

on:
  # Every three hours, every day.
  #
  # GitHub starts scheduled jobs late - the old single 7:30 AM run was actually
  # starting between noon and 7 PM Eastern. The logger no longer depends on
  # when it runs, and repeating it is harmless: today's statuses are recorded
  # once (from 6 AM Eastern on school days), and the forecast for the next
  # school day is only rewritten when it changes. Several runs a day means one
  # lands in the morning to read statuses and one in the evening to capture the
  # forecast people actually see the night before. Weekend runs keep Monday's
  # forecast current.
  schedule:
    - cron: '17 */3 * * *'

  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      force_log:
        description: 'Also log open days outside the winter season'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run (preview without saving)'
        required: false
        default: 'false'
        type: boolean

# One run at a time, so two runs never push over each other
concurrency:
  group: weather-log
  cancel-in-progress: false

jobs:
  log-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need write access to push changes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run weather logger
        id: logger
        continue-on-error: true
        run: |
          ARGS=""
          if [[ "${{ github.event.inputs.force_log }}" == "true" ]]; then
            ARGS="$ARGS --force"
          fi
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/daily-weather-log.js $ARGS

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet api/_lib/historicalData.json api/_lib/predictionLog.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/_lib/historicalData.json api/_lib/predictionLog.json
          git commit -m "Auto-log weather data for $(TZ=America/New_York date +%Y-%m-%d)

          Automated daily weather and school status logging.

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
